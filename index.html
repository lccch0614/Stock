'use strict';
const SYMBOLS=[['NVXT','NovaX Technologies','科技',128,1.6,1.5,0.33,25],['QBIT','QuantumBridge','半導體',92,1.2,1.8,0.39,35],['CLDD','CloudDock','軟件',78,1.3,1.1,0.25,28],['AURB','Aurora Bank','金融',55,.5,.8,.19,13],['VFIN','Vertex Financial','金融',71,.7,.9,.24,17],['PETR','PetroCore','能源',82,.6,1.2,.32,12],['SOLR','Solara Energy','新能源',47,1.1,1.4,.38,29],['MEDX','MediCore','醫療',113,.8,.65,.19,22],['BIOV','BioVista','生物科技',34,.8,1.7,.45,0],['RTHB','RetailHub','消費',63,.7,1.1,.25,19],['FDSN','FreshDining','消費',52,.6,.7,.19,18],['INDM','Industrial Dynamics','工業',88,.75,1.2,.27,17],['LOGX','LogiXpress','物流',59,.7,1.15,.29,16],['UTIL','United Utilities','公用事業',44,.35,.45,.14,16],['WTRS','WaterStone','公用事業',39,.3,.5,.15,18]];
const DB='stock-tycoon-mvp-v1';const STORAGE='stock-tycoon-mvp-state';const version=1;
const money=(x)=>'$'+Number(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});const num=x=>Number(x).toLocaleString('en-US',{maximumFractionDigits:2});const pct=x=>(x>=0?'+':'')+(x*100).toFixed(2)+'%';const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clamp=(a,b,c)=>Math.max(b,Math.min(c,a));const labelChange=n=>`<span class="${n>=0?'green':'red'}">${pct(n)}</span>`;
function random(s){s.rng=(Math.imul(1664525,s.rng)+1013904223)>>>0;return s.rng/4294967296}function normal(s){return Math.sqrt(-2*Math.log(Math.max(1e-10,random(s))))*Math.cos(2*Math.PI*random(s))}function round(x){return Math.round(x*100)/100}
function dateFor(day){const dt=new Date(Date.UTC(2027,0,4));dt.setUTCDate(dt.getUTCDate()+Math.floor(day/5)*7+day%5);return dt.toISOString().slice(0,10)}
function initial(seed=20271025){return {version,seed,rng:seed>>>0,day:0,market:'橫行',macro:0,seq:0,cash:10000,positions:{},orders:[],ledger:[],transactions:[],history:[{day:0,equity:10000}],level:1,unlocks:[],completed:[],news:[{day:0,title:'模擬市場正式開市',body:'15 間虛構上市公司開始交易。所有交易均使用虛擬資金。'}],stocks:Object.fromEntries(SYMBOLS.map(([ticker,name,sector,p,g,b,v,pe])=>[ticker,{ticker,name,sector,price:p,start:p,prior:p,anchor:p,baseGrowth:g,beta:b,vol:v,pe,eps:pe?round(p/pe):-.4,revenue:round(p*9),debt:round(30+v*100),quality:round(85-v*70),momentum:0,historical:[{day:0,open:p,high:p,low:p,close:p,volume:100000}],lastReturn:0}]))}};
let state=initial();let view='home',ticker='NVXT',speed=0,timer=null,orderSide='buy',orderType='market',chartRange=30,db=null,saveQueue=Promise.resolve();
function toast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toast.id);toast.id=setTimeout(()=>el.classList.add('hidden'),3500)}
function equity(){return round(state.cash+Object.entries(state.positions).reduce((a,[k,p])=>a+p.qty*state.stocks[k].price,0))}function exposure(){return Object.entries(state.positions).reduce((a,[k,p])=>a+p.qty*state.stocks[k].price,0)}function levelRequirement(l){return [0,10000,20000,50000,100000,500000,1000000,10000000][l]}
function riskScore(){const e=Math.max(1,equity()),concentration=Object.entries(state.positions).length?Math.max(...Object.entries(state.positions).map(([k,p])=>p.qty*state.stocks[k].price/e)):0;const hi=state.history.reduce((a,x)=>Math.max(a,x.equity),10000);const dd=state.history.reduce((a,x,i)=>{const peak=Math.max(10000,...state.history.slice(0,i+1).map(v=>v.equity));return Math.max(a,1-x.equity/peak)},0);return Math.round(clamp(85-Math.max(0,concentration-.2)*55-dd*80,0,100))}function maxDrawdown(){let peak=10000,d=0;for(const x of state.history){peak=Math.max(peak,x.equity);if(peak>0)d=Math.max(d,(peak-x.equity)/peak)}return d}
function unique(kind){return kind+'-'+(++state.seq)}function addLedger(type,amount,description){state.ledger.push({id:unique('L'),day:state.day,type,amount:round(amount),description,afterCash:round(state.cash)})}
function spread(st){return Math.max(.01,round(st.price*.0007))}function quote(st,side){return round(st.price+(side==='buy'?1:-1)*spread(st)/2)}function fee(q,p){return round(Math.max(.01,q*p*.0005))}
function trade(t,side,qty,orderId=null){const st=state.stocks[t];if(!st||!Number.isInteger(qty)||qty<=0)return {ok:false,msg:'無效股票或股數'};const price=quote(st,side),f=fee(qty,price),notional=round(qty*price),cost=round(notional+f),position=state.positions[t]||{qty:0,cost:0};if(side==='buy'&&state.cash+1e-7<cost)return{ok:false,msg:`可用現金不足，需要 ${money(cost)}`};if(side==='sell'&&position.qty<qty)return {ok:false,msg:'持股不足，MVP 未支援沽空'};let realized=0;if(side==='buy'){const previous=round(position.qty*position.cost);position.cost=round((previous+cost)/(position.qty+qty));position.qty+=qty;state.cash=round(state.cash-cost);state.positions[t]=position}else{realized=round(notional-f-qty*position.cost);position.qty-=qty;state.cash=round(state.cash+notional-f);if(position.qty===0)delete state.positions[t];else state.positions[t]=position}state.transactions.push({id:unique('T'),orderId,day:state.day,ticker:t,side,qty,price,fee:f,realized});addLedger(side==='buy'?'BUY':'SELL',side==='buy'?-cost:notional-f,`${side==='buy'?'買入':'賣出'} ${qty} 股 ${t}`);return{ok:true,msg:`${side==='buy'?'成功買入':'成功賣出'} ${qty} 股 ${t}，成交價 ${money(price)}`}}
function createOrder(t,side,qty,type,limit){if(!state.stocks[t])return toast('股票代號無效');if(!Number.isInteger(qty)||qty<=0)return toast('請輸入有效整數股數');if(type!=='market'&&(!Number.isFinite(limit)||limit<=0))return toast('請輸入有效觸發價格');if(side==='sell'&&(state.positions[t]?.qty||0)<qty+state.orders.filter(o=>o.status==='open'&&o.ticker===t&&o.side==='sell').reduce((a,o)=>a+o.qty,0))return toast('未持有足夠可供賣出的股票');if(side==='buy'&&type!=='market'){const reserved=state.orders.filter(o=>o.status==='open'&&o.side==='buy').reduce((a,o)=>a+o.reserved,0);const estimate=round(qty*(type==='limit'?limit:Math.max(limit,state.stocks[t].price)*1.05)*1.003);if(state.cash-reserved<estimate)return toast('掛單預留現金不足');const order={id:unique('O'),day:state.day,ticker:t,side,qty,type,limit,status:'open',reserved:estimate};state.orders.push(order);toast('掛單已建立');persist();render();return}if(type==='market'){const reserved=state.orders.filter(o=>o.status==='open'&&o.side==='buy').reduce((a,o)=>a+o.reserved,0);if(side==='buy'&&state.cash-reserved<qty*quote(state.stocks[t],'buy')+fee(qty,quote(state.stocks[t],'buy')))return toast('可用現金不足（已扣除掛單預留）');const result=trade(t,side,qty);toast(result.msg);if(result.ok){onTrade();persist()}render();return}const order={id:unique('O'),day:state.day,ticker:t,side,qty,type,limit,status:'open',reserved:0};state.orders.push(order);toast('掛單已建立');persist();render()}
function processOrders(){for(const o of state.orders){if(o.status!=='open')continue;const st=state.stocks[o.ticker];const c=st.historical.at(-1);const hit=o.type==='limit'?(o.side==='buy'?c.low<=o.limit:c.high>=o.limit):(o.side==='sell'&&c.low<=o.limit);if(!hit)continue;const baseline=st.price;const fill=o.type==='limit'?(o.side==='buy'?Math.min(o.limit,c.open):Math.max(o.limit,c.open)):Math.min(o.limit,c.open);st.price=round(Math.max(.01,fill));let r=trade(o.ticker,o.side,o.qty,o.id);st.price=baseline;if(r.ok){o.status='filled';o.filledDay=state.day}else if(o.side==='buy'&&r.msg.includes('現金不足')){o.status='rejected';o.reason=r.msg}else if(o.side==='sell'){o.status='rejected';o.reason=r.msg} } }
function onTrade(){if(state.transactions.length>=1&&!state.completed.includes('first'))state.completed.push('first');if(state.orders.some(o=>o.type==='limit'&&o.status==='filled')&&!state.completed.includes('limit'))state.completed.push('limit')}
const events=[['央行意外放寬利率政策',.016,'科技'],['油價上漲，能源類股受關注',.022,'能源'],['消費者信心轉弱，零售需求下滑',-.017,'消費'],['新藥試驗傳出重要進展',.035,'醫療'],['經濟指標不及預期，市場承壓',-.025,'ALL'],['企業盈利預期改善，市場反彈',.018,'ALL'],['物流成本上升影響企業利潤',-.017,'物流'],['能源供應增加，石油價格下跌',-.02,'能源'],['科技投資熱潮，半導體需求增加',.025,'半導體'],['信貸風險升高，金融業遭下調預期',-.024,'金融'],['工業訂單增長，製造業轉強',.018,'工業'],['市場擔憂估值過高',-.022,'科技']];
function advanceDay(){state.day++;if(state.day%17===0){const m=random(state);state.macro=m<.33?-.5:m<.66?0:.5;state.market=state.macro<0?'熊市':state.macro>0?'牛市':'橫行';state.news.unshift({day:state.day,title:`市場環境轉為${state.market}`,body:'利率、盈利預期及市場情緒重新定價。'})}let impact=null;if(random(state)<.24){const ev=events[Math.floor(random(state)*events.length)];impact={title:ev[0],effect:ev[1],sector:ev[2]};state.news.unshift({day:state.day,title:ev[0],body:`受影響範疇：${ev[2]==='ALL'?'整體市場':ev[2]}。實際走勢同時受市場波動影響。`})}const common=normal(state)*.006;for(const st of Object.values(state.stocks)){const prev=st.price,sectorShock=normal(state)*.004,individual=normal(state)*st.vol/Math.sqrt(252)*.76,meanReversion=clamp(Math.log(Math.max(.01,st.anchor)/prev)*.008,-.015,.015),drift=(st.baseGrowth*.00006)+state.macro*.0014+meanReversion;const eventImpact=impact&&(impact.sector==='ALL'||impact.sector===st.sector)?impact.effect*(.6+random(state)*.8):0;let change=clamp(drift+st.beta*common+sectorShock+individual+eventImpact,-.24,.24);st.price=round(Math.max(.05,prev*Math.exp(change)));st.prior=prev;st.lastReturn=st.price/prev-1;st.momentum=round(st.momentum*.85+change*.15);if(state.day%60===0){const epsShock=normal(state)*.045+state.macro*.025;st.eps=round(st.eps*(1+epsShock));st.revenue=round(st.revenue*(1+st.baseGrowth*.018+epsShock));st.anchor=round(Math.max(.1,st.anchor*(1+epsShock*.6+st.baseGrowth*.012)));if(random(state)<.25)state.news.unshift({day:state.day,title:`${st.name} 公布季度業績`,body:`季度收入約 ${money(st.revenue)} 百萬，EPS ${money(st.eps)}。估值及盈利預期已更新。`})}const range=Math.max(.001,Math.abs(st.price-prev)/Math.max(.01,prev));const mid=Math.max(prev,st.price),low=Math.min(prev,st.price);let high=round(mid*(1+random(state)*Math.min(.055,range+.008))),lo=round(Math.max(.01,low*(1-random(state)*Math.min(.055,range+.008))));const volume=Math.round(50000+random(state)*150000+(Math.abs(change)*6000000));st.historical.push({day:state.day,open:prev,high,low:lo,close:st.price,volume});if(st.historical.length>500)st.historical.shift()}processOrders();onTrade();state.history.push({day:state.day,equity:equity()});if(state.history.length>1500)state.history.shift();if(state.news.length>60)state.news.length=60;checkCareer()}
function checkCareer(){if(state.level===1&&state.day>=10&&equity()>=20000&&state.transactions.length>=10&&riskScore()>=50&&state.completed.includes('first')&&state.completed.includes('limit')){state.level=2;state.news.unshift({day:state.day,title:'生涯升級！Active Trader',body:'你已完成第一階段生涯目標。下一版本將開放高階交易功能。'});toast('恭喜！晉升至 Active Trader（Lv.2）')}}
function saveData(){return JSON.stringify(state)}async function openDB(){if(!window.indexedDB)return null;return new Promise(res=>{try{let req=indexedDB.open(DB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('saves'))req.result.createObjectStore('saves')};req.onsuccess=()=>res(req.result);req.onerror=()=>res(null)}catch{res(null)}})}
function persist(){const snapshot=saveData();saveQueue=saveQueue.then(async()=>{try{if(db){await new Promise((res,rej)=>{const tx=db.transaction('saves','readwrite');tx.objectStore('saves').put(snapshot,'main');tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}else localStorage.setItem(STORAGE,snapshot)}catch(e){console.error(e);toast('存檔失敗，請匯出備份')}});return saveQueue}async function loadSave(){try{let val=null;if(db)val=await new Promise(res=>{const tx=db.transaction('saves','readonly');const req=tx.objectStore('saves').get('main');req.onsuccess=()=>res(req.result);req.onerror=()=>res(null)});else val=localStorage.getItem(STORAGE);if(val){const parsed=JSON.parse(val);if(validate(parsed)){state=parsed;return true}}}catch(e){console.warn('load error',e)}return false}
function validate(s){return s&&s.version===1&&Number.isInteger(s.day)&&s.day>=0&&Number.isFinite(s.cash)&&Number.isFinite(s.rng)&&Array.isArray(s.orders)&&Array.isArray(s.transactions)&&Array.isArray(s.history)&&Array.isArray(s.news)&&s.stocks&&Object.keys(s.stocks).length===15&&s.positions&&Number.isInteger(s.seq)&&s.level>=1&&s.level<=2&&Object.values(s.stocks).every(st=>Number.isFinite(st.price)&&st.price>0&&Array.isArray(st.historical))}
function download(){const blob=new Blob([saveData()],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`stock-tycoon-day-${state.day}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('存檔已匯出')}
function switchView(v){view=v;render()}
const navs=[['home','⌂','生涯主頁'],['market','▤','股票市場'],['trade','⌁','交易中心'],['portfolio','◫','投資組合'],['career','★','生涯進度'],['history','☷','交易紀錄'],['settings','⚙','設定']];

function bar(v){return `<div class="progress"><div style="width:${clamp(v,0,100)}%"></div></div>`}
function stats(){const value=equity(),change=value-10000,last=state.history.at(-2)?.equity??10000;return `<div class="grid"><div class="card"><small>帳戶淨值 · Equity</small><div class="metric">${money(value)}</div>${labelChange(change/10000)} <small>累計報酬</small></div><div class="card"><small>可用現金 · Cash</small><div class="metric">${money(state.cash)}</div><small>不包括已掛買單預留資金</small></div><div class="card"><small>當日變化 · Daily P&L</small><div class="metric ${value-last>=0?'green':'red'}">${money(value-last)}</div>${labelChange(last?(value-last)/last:0)}</div><div class="card"><small>Risk Management Score</small><div class="metric">${riskScore()}<small> / 100</small></div>${bar(riskScore())}</div></div>`}
function drawChart(canvas,data,{candles=false}={}){if(!canvas||!data.length)return;const dpr=window.devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);let prices=candles?data.flatMap(x=>[x.low,x.high]):data.map(x=>x.equity);let min=Math.min(...prices),max=Math.max(...prices);const pad=(max-min)*.12||1;min-=pad;max+=pad;const X=i=>34+i*(w-48)/Math.max(1,data.length-1),Y=v=>12+(max-v)*(h-37)/(max-min);ctx.strokeStyle='#293950';ctx.lineWidth=1;ctx.fillStyle='#8ca5c4';ctx.font='10px sans-serif';for(let i=0;i<5;i++){let y=12+i*(h-37)/4;ctx.beginPath();ctx.moveTo(32,y);ctx.lineTo(w-8,y);ctx.stroke();ctx.fillText((max-(max-min)*i/4).toFixed(0),2,y+3)}if(candles){const cw=Math.max(2,Math.min(13,(w-50)/data.length*.6));data.forEach((p,i)=>{const col=p.close>=p.open?'#36c89b':'#e76e76';ctx.strokeStyle=col;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(X(i),Y(p.high));ctx.lineTo(X(i),Y(p.low));ctx.stroke();const top=Math.min(Y(p.open),Y(p.close));ctx.fillRect(X(i)-cw/2,top,cw,Math.max(1,Math.abs(Y(p.open)-Y(p.close))))});if(data.length>=20){const ma=20;ctx.strokeStyle='#e7b45f';ctx.lineWidth=1.5;ctx.beginPath();for(let i=ma-1;i<data.length;i++){let avg=data.slice(i-ma+1,i+1).reduce((a,x)=>a+x.close,0)/ma;i===ma-1?ctx.moveTo(X(i),Y(avg)):ctx.lineTo(X(i),Y(avg))}ctx.stroke()}}else{ctx.strokeStyle='#4fa7ec';ctx.lineWidth=2;ctx.beginPath();data.forEach((p,i)=>i?ctx.lineTo(X(i),Y(p.equity)):ctx.moveTo(X(i),Y(p.equity)));ctx.stroke()}ctx.fillStyle='#90a8c4';ctx.fillText('D'+data[0].day,34,h-5);ctx.fillText('D'+data.at(-1).day,Math.max(34,w-52),h-5)}
function marketTable(){return `<div class="table-scroll"><table><thead><tr><th>股票 / 公司</th><th>價格</th><th>日變化</th><th>行業</th></tr></thead><tbody>${Object.values(state.stocks).map(st=>`<tr class="stock-row ${ticker===st.ticker?'selected':''}" data-stock="${st.ticker}"><td><b>${st.ticker}</b><br><small>${esc(st.name)}</small></td><td>${money(st.price)}</td><td>${labelChange(st.lastReturn||0)}</td><td><small>${esc(st.sector)}</small></td></tr>`).join('')}</tbody></table></div>`}
function newsHtml(limit=5){return state.news.slice(0,limit).map(n=>`<div class="news"><time>Day ${n.day} · ${dateFor(n.day)}</time><b>${esc(n.title)}</b><div class="muted" style="font-size:12px;margin-top:4px">${esc(n.body)}</div></div>`).join('')}
function orderForm(){const st=state.stocks[ticker];return `<h2>落單 · ${ticker}</h2><div class="row"><span class="muted">模擬報價</span><b>${money(st.price)}</b></div><div class="action-set"><button id="side-buy" class="${orderSide==='buy'?'buy':'ghost'}">買入</button><button id="side-sell" class="${orderSide==='sell'?'sell':'ghost'}">賣出</button></div><label>訂單類型</label><select id="order-type" class="field"><option value="market" ${orderType==='market'?'selected':''}>市價單</option><option value="limit" ${orderType==='limit'?'selected':''}>限價單</option><option value="stop" ${orderType==='stop'?'selected':''}>止蝕單（賣出）</option></select><label>股數</label><input class="field" type="number" id="quantity" value="1" min="1" step="1" inputmode="numeric"><div id="limit-wrap" class="${orderType==='market'?'hidden':''}"><label>觸發 / 限價 (USD)</label><input class="field" type="number" id="limit-price" value="${st.price}" min=".01" step=".01" inputmode="decimal"></div><div class="highlight" id="order-preview">輸入股數預覽交易成本</div><div style="height:10px"></div><button class="primary" id="submit-order" style="width:100%">檢查並確認${orderSide==='buy'?'買入':'賣出'}</button><div class="tip" style="margin-top:12px">正股交易僅限持有股票；沽空、孖展及期權將於 V2 開放。股價、事件均為虛構。</div>`}
function chartBlock(){let st=state.stocks[ticker];return `<div class="row wrap"><div><h2>${ticker} · ${esc(st.name)}</h2><div class="metric" style="margin:0">${money(st.price)} <span style="font-size:13px">${labelChange(st.lastReturn)}</span></div></div><div class="tabline">${[20,60,150,500].map(n=>`<button data-range="${n}" class="${chartRange===n?'active':''}">${n===500?'全部':n+'D'}</button>`).join('')}</div></div><canvas class="chart" id="stock-chart"></canvas><div class="legend"><span style="--c:#36c89b">上漲 K 線</span><span style="--c:#e76e76">下跌 K 線</span><span style="--c:#e7b45f">MA20</span></div><div class="three"><div><small>EPS</small><div>${money(st.eps)}</div></div><div><small>參考 P/E</small><div>${st.eps>0?num(st.price/st.eps):'N/A'}</div></div><div><small>年化波動設定</small><div>${pct(st.vol)}</div></div></div><p class="muted" style="font-size:12px">公司財務資料均為虛構模擬值。技術指標依據價格序列計算。</p>`}
function orderTable(){const orders=state.orders.filter(o=>o.status==='open');return orders.length?`<div class="table-scroll"><table><tr><th>股票</th><th>方向</th><th>類型</th><th>價格</th><th>股數</th><th></th></tr>${orders.map(o=>`<tr><td>${o.ticker}</td><td>${o.side==='buy'?'買':'賣'}</td><td>${o.type==='limit'?'限價':'止蝕'}</td><td>${money(o.limit)}</td><td>${o.qty}</td><td><button data-cancel="${o.id}">取消</button></td></tr>`).join('')}</table></div>`:'<div class="none">暫無未成交訂單</div>'}
function portfolioTable(){const entries=Object.entries(state.positions);return entries.length?`<div class="table-scroll"><table><tr><th>股票</th><th>股數</th><th>平均成本*</th><th>市值</th><th>未實現 P&L</th></tr>${entries.map(([k,p])=>{let value=p.qty*state.stocks[k].price,gain=value-p.qty*p.cost;return `<tr class="stock-row" data-stock="${k}"><td><b>${k}</b></td><td>${p.qty}</td><td>${money(p.cost)}</td><td>${money(value)}</td><td class="${gain>=0?'green':'red'}">${money(gain)}</td></tr>`}).join('')}</table><small>*平均成本包含買入交易費，賣出費用在實際成交時入帳。</small></div>`:'<div class="none">你尚未持有股票，可前往交易中心開始投資。</div>'}
function home(){const e=equity(),next=levelRequirement(2),progress=clamp(e/next*100,0,100);return `${stats()}<div class="two"><div class="card"><div class="row"><h2>資產淨值曲線</h2><span class="pill">${state.history.length} 個記錄點</span></div><canvas id="equity-chart" class="chart"></canvas><small>根據模擬帳戶每日淨值繪製</small></div><div class="card"><h2>Career · Level ${state.level}</h2><h3>${state.level===1?'Rookie Investor':'Active Trader'}</h3><div class="row"><small>下一級資產門檻</small><b>${state.level===1?money(next):'V2 開放'}</b></div>${bar(state.level===1?progress:100)}<div class="row"><small>風險評級</small><b>${riskScore()} / 100</b></div><div class="row"><small>完成交易</small><b>${state.transactions.length} / 10</b></div><div class="row"><small>已遊玩交易日</small><b>${state.day} / 10</b></div><button class="primary" data-nav="career" style="width:100%">查看生涯條件 →</button></div></div><div class="two"><div class="card"><div class="row"><h2>市場概況</h2><button data-nav="market">全部股票 →</button></div>${marketTable()}</div><div class="card"><h2>最新市場新聞</h2>${newsHtml(6)}</div></div>`}
function market(){return `${stats()}<div class="two"><div class="card"><div class="row"><h2>虛構股票市場</h2><span class="pill">${state.market}</span></div>${marketTable()}</div><div class="card">${chartBlock()}<button class="primary" id="trade-current" style="width:100%;margin-top:12px">交易 ${ticker} →</button></div></div><div class="card" style="margin-top:14px"><h2>市場新聞</h2>${newsHtml(8)}</div>`}
function trading(){return `<div class="two"><div><div class="card">${chartBlock()}</div><div class="card" style="margin-top:14px"><h2>未成交訂單</h2>${orderTable()}</div></div><div><div class="card">${orderForm()}</div><div class="card" style="margin-top:14px"><h2>股票選擇</h2><select class="field" id="choose-ticker">${Object.values(state.stocks).map(st=>`<option value="${st.ticker}" ${ticker===st.ticker?'selected':''}>${st.ticker} — ${esc(st.name)}</option>`).join('')}</select><div class="row"><small>可用現金（扣除預留）</small><b>${money(state.cash-state.orders.filter(o=>o.status==='open'&&o.side==='buy').reduce((a,o)=>a+o.reserved,0))}</b></div><div class="row"><small>持有 ${ticker}</small><b>${state.positions[ticker]?.qty||0} 股</b></div></div></div></div>`}
function portfolio(){const realized=state.transactions.reduce((a,t)=>a+t.realized,0);return `${stats()}<div class="two"><div class="card"><h2>目前持倉</h2>${portfolioTable()}</div><div class="card"><h2>資產配置與風險</h2><div class="row"><small>持倉總市值</small><b>${money(exposure())}</b></div><div class="row"><small>現金</small><b>${money(state.cash)}</b></div><div class="row"><small>已實現損益</small><b class="${realized>=0?'green':'red'}">${money(realized)}</b></div><div class="row"><small>最大回撤</small><b>${(maxDrawdown()*100).toFixed(2)}%</b></div><div class="row"><small>風險評級</small><b>${riskScore()} / 100</b></div>${bar(riskScore())}<div class="tip" style="margin-top:15px">休閒模式：集中持倉提供提示；不以風險分數禁止正常正股交易。</div></div></div>`}
function career(){const req=state.level===1?20000:50000;let progress=state.level===1?clamp(equity()/req*100,0,100):100;let tasks=[['首次交易',state.completed.includes('first')],['完成 10 筆交易',state.transactions.length>=10],['成功成交一次限價單',state.completed.includes('limit')],['完成 10 個交易日',state.day>=10],['Risk Score ≥ 50',riskScore()>=50],['帳戶淨值達到 $20,000',equity()>=20000]];return `<div class="two"><div class="card"><h2>Level ${state.level} · ${state.level===1?'Rookie Investor':'Active Trader'}</h2><div class="metric">${money(equity())}</div><small>Lv.2 門檻 $20,000</small>${bar(progress)}<h3 style="margin-top:25px">晉級檢查清單</h3>${tasks.map(([t,done])=>`<div class="row"><span>${done?'✅':'○'} ${t}</span><span class="pill">${done?'達成':'未達成'}</span></div>`).join('')}<div class="tip">需同時符合所有條件；本 MVP 的生涯進度開放至 Lv.2。V2 將加入沽空、期權及 Lv.3–4。</div></div><div class="card"><h2>七階段完整職涯規劃</h2>${[['1','Rookie Investor','$10,000'],['2','Active Trader','$20,000'],['3','Experienced Trader','$50,000'],['4','Professional Trader','$100,000'],['5','Portfolio Manager','$500,000'],['6','Hedge Fund Founder','$1,000,000'],['7','Market Legend','$10,000,000']].map(([lv,n,eq])=>`<div class="row line"><div><b>Lv.${lv} ${n}</b><br><small>${Number(lv)>2?'V2 / V3 解鎖':'MVP'}</small></div><b>${eq}</b></div>`).join('')}</div></div>`}
function history(){const tx=[...state.transactions].reverse();return `<div class="card"><h2>交易歷史 · ${tx.length} 筆成交</h2>${tx.length?`<div class="table-scroll"><table><tr><th>交易日</th><th>股票</th><th>方向</th><th>股數</th><th>成交價</th><th>費用</th><th>已實現 P&L</th></tr>${tx.map(t=>`<tr><td>D${t.day}</td><td>${t.ticker}</td><td>${t.side==='buy'?'買入':'賣出'}</td><td>${t.qty}</td><td>${money(t.price)}</td><td>${money(t.fee)}</td><td class="${t.realized>=0?'green':'red'}">${money(t.realized)}</td></tr>`).join('')}</table></div>`:'<div class="none">尚無任何交易</div>'}</div><div class="card" style="margin-top:14px"><h2>訂單歷史</h2>${state.orders.length?`<div class="table-scroll"><table><tr><th>訂單 ID</th><th>股票</th><th>方向</th><th>類型</th><th>狀態</th></tr>${[...state.orders].reverse().map(o=>`<tr><td>${o.id}</td><td>${o.ticker}</td><td>${o.side}</td><td>${o.type}</td><td>${o.status}</td></tr>`).join('')}</table></div>`:'<div class="none">尚無掛單歷史</div>'}</div>`}
function settings(){return `<div class="two"><div class="card"><h2>遊戲儲存及備份</h2><p class="muted">遊戲在交易、推進交易日及更改關鍵狀態時自動保存到 IndexedDB；不支援時使用 localStorage。</p><div class="row"><small>目前遊戲日</small><b>Day ${state.day} · ${dateFor(state.day)}</b></div><div class="row"><small>儲存方式</small><b>${db?'IndexedDB':'LocalStorage'}</b></div><div class="action-set"><button id="export">匯出 JSON 備份</button><button id="import">匯入存檔</button></div><div class="tip" style="margin-top:14px">本地存檔可能因清除瀏覽器資料而消失，建議定期匯出備份。</div></div><div class="card"><h2>重新開始</h2><p class="muted">重新生成 $10,000 初始帳戶和 15 間上市公司，原本的生涯進度將被覆蓋。</p><button class="sell" id="reset">重啟生涯</button><h3 style="margin-top:25px">關於 MVP</h3><p class="muted">目前：正股交易、基本面市場、新聞事件、風控分數、Lv.1–2 生涯、自動存檔。</p><p class="muted">V2：沽空、期權、保證金、進階策略。</p></div></div>`}
const views={home:['Career Dashboard',home],market:['Market Overview',market],trade:['Trading Terminal',trading],portfolio:['Portfolio & Risk',portfolio],career:['Career Progression',career],history:['Trading History',history],settings:['Settings & Saves',settings]};
function render(){document.getElementById('heading').textContent=views[view][0];document.getElementById('subheading').textContent=`LEVEL ${state.level} · ${state.market} · 虛擬資金`;document.getElementById('clock').textContent=`Day ${state.day} · ${dateFor(state.day)}`;document.getElementById('pause').textContent=speed?'Ⅱ 暫停':'▶ 播放';document.getElementById('speed').textContent=(speed||1)+'×';document.getElementById('sidebar').innerHTML=navHtml();document.getElementById('mobile').innerHTML=navHtml(true);document.getElementById('content').innerHTML=views[view][1]();const chart=document.getElementById('stock-chart');if(chart)drawChart(chart,state.stocks[ticker].historical.slice(-chartRange),{candles:true});const eq=document.getElementById('equity-chart');if(eq)drawChart(eq,state.history.slice(-150));const q=document.getElementById('quantity');if(q){q.addEventListener('input',updatePreview);document.getElementById('limit-price')?.addEventListener('input',updatePreview);updatePreview()}}
function updatePreview(){const q=Number(document.getElementById('quantity')?.value),st=state.stocks[ticker],price=orderType==='market'?quote(st,orderSide):Number(document.getElementById('limit-price')?.value);const target=document.getElementById('order-preview');if(!target)return;if(!Number.isInteger(q)||q<=0||!Number.isFinite(price)||price<=0){target.textContent='請填寫有效股數及價格';return}const total=round(q*price+fee(q,price));target.innerHTML=`預計名義價值 <b>${money(q*price)}</b><br>預計買入總成本 <b>${money(total)}</b><br><small>實際執行報價可能因價格及滑點變動而不同</small>`}
function setSpeed(v){speed=v;clearInterval(timer);timer=null;if(speed)timer=setInterval(()=>{advanceDay();persist();render()},60000/speed);render()}
function onClick(ev){const target=ev.target.closest('button,[data-stock]');if(!target)return;if(target.dataset.nav){switchView(target.dataset.nav);return}if(target.dataset.stock){ticker=target.dataset.stock;view='trade';render();return}if(target.dataset.range){chartRange=Number(target.dataset.range);render();return}if(target.dataset.cancel){const o=state.orders.find(o=>o.id===target.dataset.cancel);if(o&&o.status==='open'){o.status='cancelled';persist();toast('已取消掛單');render()}return}switch(target.id){case 'pause':setSpeed(speed?0:1);break;case 'speed':setSpeed(speed===1?2:speed===2?5:1);break;case 'next':advanceDay();persist();render();break;case 'side-buy':orderSide='buy';if(orderType==='stop')orderType='market';render();break;case 'side-sell':orderSide='sell';render();break;case 'submit-order':{const qty=Number(document.getElementById('quantity').value),limit=Number(document.getElementById('limit-price')?.value||0);if(!Number.isInteger(qty)||qty<=0){toast('股數須為正整數');return}if(!confirm(`確認${orderSide==='buy'?'買入':'賣出'} ${qty} 股 ${ticker}（${orderType==='market'?'市價':orderType==='limit'?'限價':'止蝕'}單）？`))return;createOrder(ticker,orderSide,qty,orderType,limit);break}case 'trade-current':switchView('trade');break;case 'export':download();break;case 'import':document.getElementById('import-file').click();break;case 'reset':if(confirm('確定重啟？目前帳戶及交易紀錄將被覆蓋。建議先匯出存檔。')){setSpeed(0);state=initial((Date.now()>>>0)||1);persist();view='home';toast('新生涯已開始');render()}break}}
async function onChange(ev){if(ev.target.id==='order-type'){orderType=ev.target.value;if(orderType==='stop')orderSide='sell';render()}if(ev.target.id==='choose-ticker'){ticker=ev.target.value;render()}if(ev.target.id==='import-file'){const f=ev.target.files?.[0];if(!f)return;try{if(f.size>3000000)throw Error('檔案過大');const s=JSON.parse(await f.text());if(!validate(s))throw Error('版本不兼容或資料不正確');if(!confirm('匯入後將覆蓋目前進度，確定嗎？'))return;setSpeed(0);state=s;await persist();render();toast('存檔匯入成功')}catch(e){toast('匯入失敗：'+e.message)}ev.target.value=''}}
async function init(){db=await openDB();await loadSave();document.addEventListener('click',onClick);document.addEventListener('change',onChange);window.addEventListener('resize',()=>{const c=document.getElementById('stock-chart');if(c)drawChart(c,state.stocks[ticker].historical.slice(-chartRange),{candles:true});const e=document.getElementById('equity-chart');if(e)drawChart(e,state.history.slice(-150))});render();await persist()}init();
window.STOCK_TYCOON_TEST={initial,trade,advanceDay,equity,validate,getState:()=>state,setState:s=>state=s,processOrders,riskScore};
</script></body></html>
